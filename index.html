<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楽天モバイル 日報作成ツール</title>
    <style>
        :root {
            --rakuten-pink: #bf0000;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.5rem;
            color: var(--rakuten-pink);
            text-align: center;
            margin-top: 0;
        }
        .section-title {
            font-weight: bold;
            font-size: 1.1rem;
            border-left: 4px solid var(--rakuten-pink);
            padding-left: 8px;
            margin: 20px 0 10px 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        input[type="number"], input[type="date"], input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .output-area {
            margin-top: 25px;
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: var(--rakuten-pink);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:active {
            background-color: #990000;
        }
        .btn-parse {
            background-color: #333;
            margin-bottom: 20px;
        }
        .custom-input-area {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background-color: #fff9fb;
            border: 1px solid #ffc0cb;
            border-radius: 6px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        .modal-box h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--rakuten-pink);
        }
        #pasteTextarea {
            width: 100%;
            height: 40vh;
            min-height: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
        }
        .modal-btn-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .modal-btn-row .btn {
            margin-top: 0;
        }
        .btn-cancel {
            background-color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>日報作成アシスタント</h1>
    
    <div class="form-group">
        <label style="color: var(--rakuten-pink); font-weight: bold;">【1】まず前日の実績を読み込みます</label>
        <button class="btn btn-parse" onclick="openPasteModal()">ここをタップして前日の日報を貼り付ける</button>
    </div>

    <hr style="border: 0; border-top: 1px dashed #ccc; margin: 20px 0;">

    <div class="form-group">
        <label>【2】報告日付</label>
        <input type="date" id="reportDate">
    </div>

    <div class="section-title">▼集客（本日分のみ入力）</div>
    <div class="grid-3">
        <div class="form-group"><label>本日来客数</label><input type="number" id="visitorCount" value="0"></div>
        <div class="form-group"><label>来客組数</label><input type="number" id="visitorPairs" value="0"></div>
        <div class="form-group"><label>内既存人数</label><input type="number" id="existingCount" value="0"></div>
    </div>

    <div class="section-title">▼SIM</div>
    <div class="grid-3">
        <div class="form-group"><label>月間目標</label><input type="number" id="simTar" value="187"></div>
        <div class="form-group"><label>前日迄累計</label><input type="number" id="simPrev" value="0" readonly style="background: #e9ecef;"></div>
        <div class="form-group"><label>本日実績</label><input type="number" id="simToday" value="0"></div>
    </div>

    <div class="section-title">▼オプション：ひかり</div>
    <div class="grid-3">
        <div class="form-group"><label>月間目標</label><input type="number" id="hikariTar" value="8"></div>
        <div class="form-group"><label>前日迄累計</label><input type="number" id="hikariPrev" value="0" readonly style="background: #e9ecef;"></div>
        <div class="form-group"><label>本日実績</label><input type="number" id="hikariToday" value="0"></div>
    </div>
    <div class="form-group">
        <label>獲得トーク・事例</label>
        <select id="hikariTalk" onchange="toggleCustom('hikari')">
            <option value="">-- 選択してください --</option>
            <option value="工事費のポイント還元と毎月のポイント還元をフックに獲得。">工事費・毎月のポイント還元訴求</option>
            <option value="モバイル、カード、ひかりでSPU9倍、楽天市場で1万円分お買い物すると900ポイントも付与されるので、楽天でまとめるメリットを話して獲得。">SPU9倍・楽天市場まとめメリット訴求</option>
            <option value="オンラインゲームやリモート会議のラグが少ないので、テザリングよりひかりがおすすめと話して獲得。">品質重視（ゲーム・リモート会議）訴求</option>
            <option value="FREE">その他（自由入力）</option>
        </select>
        <div id="hikariFreeArea" class="custom-input-area">
            <label>自由入力欄（ひかり）</label>
            <input type="text" id="hikariFreeText" placeholder="獲得事例を自由に入力してください">
        </div>
    </div>

    <div class="section-title">▼オプション：Turbo</div>
    <div class="grid-3">
        <div class="form-group"><label>月間目標</label><input type="number" id="turboTar" value="5"></div>
        <div class="form-group"><label>前日迄累計</label><input type="number" id="turboPrev" value="0" readonly style="background: #e9ecef;"></div>
        <div class="form-group"><label>本日実績</label><input type="number" id="turboToday" value="0"></div>
    </div>
    <div class="form-group">
        <label>獲得トーク・事例</label>
        <select id="turboTalk" onchange="toggleCustom('turbo')">
            <option value="">-- 選択してください --</option>
            <option value="引っ越しが多いと伺ったので、ひかりよりTurboの方が引っ越しの手続きが手軽。">引っ越し手続きの手軽さ訴求</option>
            <option value="工事不要ですぐ利用できる。">工事不要・即日利用訴求</option>
            <option value="配線のごちゃつきを気にされていたので、ひかりと違ってTurboは配線が1本なので線がごちゃつくことがなく、部屋がすっきりするのでおすすめと話して獲得。">配線すっきり・部屋の美観訴求</option>
            <option value="モバイル、カード、ターボでSPU9倍、楽天市場で1万円分お買い物すると900ポイントも付与されるので、楽天でまとめるメリットを話して獲得。">SPU9倍・楽天市場まとめメリット訴求</option>
            <option value="FREE">その他（自由入力）</option>
        </select>
        <div id="turboFreeArea" class="custom-input-area">
            <label>自由入力欄（Turbo）</label>
            <input type="text" id="turboFreeText" placeholder="獲得事例を自由に入力してください">
        </div>
    </div>

    <div class="section-title">▼オプション：カード</div>
    <div class="grid-3">
        <div class="form-group"><label>月間目標</label><input type="number" id="cardTar" value="37"></div>
        <div class="form-group"><label>前日迄累計</label><input type="number" id="cardPrev" value="0" readonly style="background: #e9ecef;"></div>
        <div class="form-group"><label>本日実績</label><input type="number" id="cardToday" value="0"></div>
    </div>
    <div class="form-group">
        <label>獲得トーク・事例</label>
        <select id="cardTalk" onchange="toggleCustom('card')">
            <option value="">-- 選択してください --</option>
            <option value="楽天カード1枚だけ所持と伺ったので、破損や不正利用されてカードが使えなくなった時のリスクを伝え、2枚目の提案をして獲得。">1枚所持のリスク・2枚目提案</option>
            <option value="楽天カードのデザインを変更希望のお客様に2枚目を提案して獲得。">デザイン変更希望への2枚目提案</option>
            <option value="今後は楽天市場を利用してみたいと伺ったので、SPUについて説明して獲得。">楽天市場利用希望へのSPU訴求</option>
            <option value="発行手数料、年会費無料。">発行手数料・年会費無料訴求</option>
            <option value="FREE">その他（自由入力）</option>
        </select>
        <div id="cardFreeArea" class="custom-input-area">
            <label>自由入力欄（カード）</label>
            <input type="text" id="cardFreeText" placeholder="獲得事例を自由に入力してください">
        </div>
    </div>

    <div class="section-title">▼オプション：かけ放題</div>
    <div class="grid-3">
        <div class="form-group"><label>月間目標</label><input type="number" id="kakeTar" value="100"></div>
        <div class="form-group"><label>前日迄累計</label><input type="number" id="kakePrev" value="0" readonly style="background: #e9ecef;"></div>
        <div class="form-group"><label>本日実績</label><input type="number" id="kakeToday" value="0"></div>
    </div>
    <div class="form-group">
        <label>獲得トーク・事例</label>
        <select id="kakeTalk" onchange="toggleCustom('kake')">
            <option value="">-- 選択してください --</option>
            <option value="Apple Watchから通話を沢山されるならオススメ。">Apple Watchからの通話利用</option>
            <option value="通話の録音をしたいと伺い、楽天リンクでは録音機能が利用できないことを説明し、通話を沢山されるとのことだったので獲得。">録音希望へのLink仕様説明・獲得</option>
            <option value="ご年配の方だったので、かけ間違えた時の通話料高額のリスクを伝え獲得。">かけ間違い時の通話料高額リスク訴求</option>
            <option value="通話品質維持のため。">通話品質維持のため</option>
            <option value="FREE">その他（自由入力）</option>
        </select>
        <div id="kakeFreeArea" class="custom-input-area">
            <label>自由入力欄（かけ放題）</label>
            <input type="text" id="kakeFreeText" placeholder="獲得事例を自由に入力してください">
        </div>
    </div>

    <div class="section-title">▼オプション：最強保護</div>
    <div class="grid-3">
        <div class="form-group"><label>月間目標</label><input type="number" id="hogoTar" value="63"></div>
        <div class="form-group"><label>前日迄累計</label><input type="number" id="hogoPrev" value="0" readonly style="background: #e9ecef;"></div>
        <div class="form-group"><label>本日実績</label><input type="number" id="hogoToday" value="0"></div>
    </div>
    <div class="form-group">
        <label>獲得トーク・事例</label>
        <select id="hogoTalk" onchange="toggleCustom('hogo')">
            <option value="">-- 選択してください --</option>
            <option value="過去の個人情報漏洩についてもお調べが可能。">個人情報漏洩チェックの訴求</option>
            <option value="乗り換え元のキャリアでもノートンなどを利用していたとお伺いしたため。">前キャリアでのセキュリティ利用継続</option>
            <option value="FREE">その他（自由入力）</option>
        </select>
        <div id="hogoFreeArea" class="custom-input-area">
            <label>自由入力欄（最強保護）</label>
            <input type="text" id="hogoFreeText" placeholder="獲得事例を自由に入力してください">
        </div>
    </div>

    <button class="btn" onclick="generateReport()">【3】本日分の日報テキストを生成</button>

    <div class="output-area">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <strong>【生成された最新日報】</strong>
            <button onclick="copyToClipboard()" style="padding: 4px 8px; font-size: 0.8rem; cursor: pointer;">コピー</button>
        </div>
        <pre id="outputText">「本日分の日報テキストを生成」を押すとここに表示されます</pre>
    </div>
</div>

<div class="modal-overlay" id="pasteModal">
    <div class="modal-box">
        <h2>前日の日報を貼り付けてください</h2>
        <textarea id="pasteTextarea" placeholder="ここに前日の日報テキストを貼り付け（ペースト）してください"></textarea>
        <div class="modal-btn-row">
            <button class="btn btn-cancel" onclick="closePasteModal()">キャンセル</button>
            <button class="btn" onclick="parsePastReportText()">読み込む</button>
        </div>
    </div>
</div>

<script>
    const today = new Date();
    document.getElementById('reportDate').value = today.toISOString().split('T')[0];

    function toggleCustom(id) {
        const select = document.getElementById(id + 'Talk');
        const freeArea = document.getElementById(id + 'FreeArea');
        if (select && freeArea) {
            if (select.value === 'FREE') {
                freeArea.style.display = 'block';
            } else {
                freeArea.style.display = 'none';
            }
        }
    }

    function openPasteModal() {
        document.getElementById('pasteTextarea').value = '';
        document.getElementById('pasteModal').classList.add('active');
        // iOSでキーボードが自動で出るようフォーカスする
        setTimeout(function() {
            document.getElementById('pasteTextarea').focus();
        }, 100);
    }

    function closePasteModal() {
        document.getElementById('pasteModal').classList.remove('active');
    }

    function parsePastReportText() {
        // textareaの値は改行(\n)がOS・機種に関わらず正しく保持されるため、
        // iPhoneのSafariでも問題なく複数行のまま取得できる
        let text = document.getElementById('pasteTextarea').value;

        if (!text || !text.trim()) {
            alert('テキストが入力されていません。前日の日報を貼り付けてから「読み込む」を押してください。');
            return;
        }

        // 念のため、iOSのオートコレクトで紛れ込む可能性のある
        // CR(\r)やCRLF(\r\n)を通常のLF(\n)に統一しておく
        text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

        closePasteModal();

        // 数値を抽出する汎用関数（「月間実績：」用と「月間目標：」用の2パターンに対応）
        // ※ blockKeyword は見出し行を一意に特定するため、前後に改行を含めて渡す
        //   （例: '\nカード\n'）。これにより、獲得トーク文中に同じ単語が
        //   含まれていても誤ってマッチしないようにする。
        const extractNum = (blockKeyword, targetKeyword) => {
            const blockIndex = text.indexOf(blockKeyword);
            if (blockIndex === -1) return null;
            
            const afterBlockText = text.substring(blockIndex);
            const targetIndex = afterBlockText.indexOf(targetKeyword);
            if (targetIndex === -1) return null;
            
            const numText = afterBlockText.substring(targetIndex, targetIndex + 30);
            const match = numText.match(/\d+/);
            return match ? Number(match[0]) : null;
        };

        // 前日迄累計（月間実績）の読み込み
        // 見出し行を改行付きで指定し、獲得トーク文中の同一単語との誤マッチを防止
        document.getElementById('simPrev').value = extractNum('\n▼SIM\n', '月間実績：') || 0;
        document.getElementById('hikariPrev').value = extractNum('\nひかり\n', '月間実績：') || 0;
        document.getElementById('turboPrev').value = extractNum('\nTurbo\n', '月間実績：') || 0;
        document.getElementById('cardPrev').value = extractNum('\nカード\n', '月間実績：') || 0;
        document.getElementById('kakePrev').value = extractNum('\nかけ放題\n', '月間実績：') || 0;
        document.getElementById('hogoPrev').value = extractNum('\n最強保護\n', '月間実績：') || 0;

        // 【新機能】日報に書いてある月間目標も自動で読み込んで上書きする
        const simTarVal = extractNum('\n▼SIM\n', '月間目標：');
        if (simTarVal !== null) document.getElementById('simTar').value = simTarVal;

        const hikariTarVal = extractNum('\nひかり\n', '月間目標：');
        if (hikariTarVal !== null) document.getElementById('hikariTar').value = hikariTarVal;

        const turboTarVal = extractNum('\nTurbo\n', '月間目標：');
        if (turboTarVal !== null) document.getElementById('turboTar').value = turboTarVal;

        const cardTarVal = extractNum('\nカード\n', '月間目標：');
        if (cardTarVal !== null) document.getElementById('cardTar').value = cardTarVal;

        const kakeTarVal = extractNum('\nかけ放題\n', '月間目標：');
        if (kakeTarVal !== null) document.getElementById('kakeTar').value = kakeTarVal;

        const hogoTarVal = extractNum('\n最強保護\n', '月間目標：');
        if (hogoTarVal !== null) document.getElementById('hogoTar').value = hogoTarVal;

        alert('前日の実績数値、および月間目標数を正常に読み込みました！');
    }

    function generateReport() {
        const dateInput = new Date(document.getElementById('reportDate').value);
        const dateStr = (dateInput.getMonth() + 1) + '月' + dateInput.getDate() + '日';

        const getNumValue = (id) => {
            const val = document.getElementById(id).value;
            return val ? (Number(val) || 0) : 0;
        };

        const visitorCount = document.getElementById('visitorCount').value || 0;
        const visitorPairs = document.getElementById('visitorPairs').value || 0;
        const existingCount = document.getElementById('existingCount').value || 0;

        const simTar = document.getElementById('simTar').value || 0;
        const simPrev = getNumValue('simPrev');
        const simToday = getNumValue('simToday');

        const hikariTar = document.getElementById('hikariTar').value || 0;
        const hikariPrev = getNumValue('hikariPrev');
        const hikariToday = getNumValue('hikariToday');

        const turboTar = document.getElementById('turboTar').value || 0;
        const turboPrev = getNumValue('turboPrev');
        const turboToday = getNumValue('turboToday');

        const cardTar = document.getElementById('cardTar').value || 0;
        const cardPrev = getNumValue('cardPrev');
        const cardToday = getNumValue('cardToday');

        const kakeTar = document.getElementById('kakeTar').value || 0;
        const kakePrev = getNumValue('kakePrev');
        const kakeToday = getNumValue('kakeToday');

        const hogoTar = document.getElementById('hogoTar').value || 0;
        const hogoPrev = getNumValue('hogoPrev');
        const hogoToday = getNumValue('hogoToday');

        const getTalkText = (id) => {
            const sel = document.getElementById(id + 'Talk');
            if (!sel) return '';
            if (sel.value === 'FREE') {
                const freeTxt = document.getElementById(id + 'FreeText');
                return freeTxt ? (freeTxt.value || '(未入力)') : '(未入力)';
            }
            return sel.value || '';
        };

        const hikariText = getTalkText('hikari');
        const turboText = getTalkText('turbo');
        const cardText = getTalkText('card');
        const kakeText = getTalkText('kake');
        const hogoText = getTalkText('hogo');

        const reportText = '【実績報告】' + dateStr + '\n\n' +
'▼集客\n' +
'本日来客数：' + visitorCount + '人（' + visitorPairs + '組）\n' +
'∟内既存：' + existingCount + '人\n\n' +
'▼SIM\n' +
'月間目標：' + simTar + '件\n' +
'月間実績：' + (simPrev + simToday) + '件\n' +
'本日実績：' + simToday + '件\n\n' +
'▼オプション\n' +
'ひかり\n' +
'・月間目標： ' + hikariTar + '件\n' +
'・月間実績： ' + (hikariPrev + hikariToday) + '件\n' +
'・本日実績： ' + hikariToday + '件\n' +
'（本日獲得のトーク・事例）\n' +
'・' + hikariText + '\n\n' +
'Turbo\n' +
'・月間目標： ' + turboTar + '件\n' +
'・月間実績： ' + (turboPrev + turboToday) + '件\n' +
'・本日実績： ' + turboToday + '件\n' +
'（本日獲得のトーク・事例）\n' +
'・' + turboText + '\n\n' +
'カード\n' +
'・月間目標： ' + cardTar + '件\n' +
'・月間実績： ' + (cardPrev + cardToday) + '件\n' +
'・本日実績： ' + cardToday + '件\n' +
'（本日獲得のトーク・事例）\n' +
'・' + cardText + '\n\n' +
'かけ放題\n' +
